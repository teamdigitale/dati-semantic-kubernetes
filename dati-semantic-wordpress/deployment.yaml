---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dati-semantic-wordpress
  name: dati-semantic-wordpress
  namespace: ndc-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dati-semantic-wordpress
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: dati-semantic-wordpress
      annotations:
        wordpress-bootstrap-trigger: "bootstrap-20260701-1"
    spec:
      initContainers:
        - name: clean-wordpress-html
          image: busybox
          command:
            - sh
            - -c
            - |
              set -eu

              STATE_FILE="/var/lib/wp-bootstrap/last-bootstrap-trigger"
              CURRENT_TRIGGER="${WORDPRESS_BOOTSTRAP_TRIGGER:-}"
              LAST_TRIGGER=""

              if [ -f "$STATE_FILE" ]; then
                LAST_TRIGGER="$(cat "$STATE_FILE")"
              fi

              if [ -z "$CURRENT_TRIGGER" ]; then
                echo "No bootstrap trigger set; preserving /var/www/html."
              elif [ "$LAST_TRIGGER" = "$CURRENT_TRIGGER" ]; then
                echo "Bootstrap trigger already processed; preserving /var/www/html."
              else
                echo "New bootstrap trigger detected; cleaning /var/www/html."
                find /var/www/html -mindepth 1 -maxdepth 1 \
                  ! -name wp-bootstrap-state -exec rm -rf -- {} +
              fi
          ports:
            - containerPort: 8080
              name: wordpress
          env:
            - name: WORDPRESS_BOOTSTRAP_TRIGGER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['wordpress-bootstrap-trigger']
          volumeMounts:
            - name: wordpress-persistent-storage
              mountPath: /var/www/html
            - name: wordpress-persistent-storage
              mountPath: /var/lib/wp-bootstrap
              subPath: wp-bootstrap-state

      containers:
        - name: dati-semantic-wordpress
          image: ghcr.io/teamdigitale/dati-semantic-wordpress:20260702-114-6ae2615
          ports:
            - containerPort: 8080
              name: wordpress
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    echo "[bootstrap] Launching async WordPress bootstrap..."
                    /usr/local/bin/wp-bootstrap.sh >> /proc/1/fd/1 2>&1 &
          env:
            - name: ALERTER_SMTP_SERVER
              value: smtp.istat.it
            - name: ALERTER_SMTP_PORT
              value: "465"
            - name: ALERTER_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ndc-istat-smtp-prod
                  key: smtp-password
            - name: ALERTER_SMTP_STARTTLS
              value: "false"
            - name: ALERTER_SMTP_SSL
              value: "true"
            - name: ALERTER_SMTP_FROM_EMAIL
              value: noreply@istat.it
            - name: SMTP_USERNAME
              value: servicedesk-schema@istat.it
            - name: XDG_CONFIG_HOME
              value: /tmp/
            - name: WORDPRESS_BOOTSTRAP_TRIGGER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['wordpress-bootstrap-trigger']

            # DATABASE ENV
            - name: WORDPRESS_DB_HOST
              value: istat-db-prod.mysql.database.azure.com
            - name: WORDPRESS_DB_USER
              value: pd_ndc_wp_ddl
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pd-ndc-wp-psw
                  key: pd-ndc-wp-psw
            - name: WORDPRESS_DB_NAME
              value: pd_ndc_wp
            - name: WORDPRESS_TABLE_PREFIX
              value: wp_
            - name: WORDPRESS_SITE_URL
              value: https://schema.gov.it

            # MATOMO ENV
            - name: MATOMO_API_URL
              value: https://analytics.istat.it/?module=API
            - name: MATOMO_SITE_ID
              value: "33"
            - name: MATOMO_USER
              value: dtd
            - name: MATOMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matomo-credentials
                  key: token
            - name: MATOMO_PASS
              valueFrom:
                secretKeyRef:
                  name: matomo-credentials
                  key: pass

            # API URL
            - name: API_URL
              value: "api"

            # EXTRA WP-CONFIG
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                $__host = '';

                if (!empty($_SERVER['HTTP_X_FORWARDED_HOST'])) {
                  $__host = $_SERVER['HTTP_X_FORWARDED_HOST'];
                } elseif (!empty($_SERVER['HTTP_HOST'])) {
                  $__host = $_SERVER['HTTP_HOST'];
                }

                $__host = strtolower(trim(explode(',', $__host)[0]));
                $__host = preg_replace('/:\d+$/', '', $__host);
                $__forwarded_proto = '';

                if (!empty($_SERVER['HTTP_X_FORWARDED_PROTO'])) {
                  $__forwarded_proto = strtolower(trim(explode(',', $_SERVER['HTTP_X_FORWARDED_PROTO'])[0]));
                }

                if ($__forwarded_proto === 'https') {
                  $_SERVER['HTTPS'] = 'on';
                }

                $__allowed = array(
                  'schema.gov.it',
                  'wp-ndc-prod-blue.apps.cloudpub.istat.it',
                  'wp-ndc-prod-green.apps.cloudpub.istat.it'
                );

                if ($__host === '' || !in_array($__host, $__allowed, true)) {
                  $__base = getenv('WORDPRESS_SITE_URL') ?: 'https://schema.gov.it';
                } else {
                  $__proto = 'https';

                  if ($__forwarded_proto !== '') {
                    $__proto = $__forwarded_proto;
                  } elseif (!empty($_SERVER['HTTPS']) && $_SERVER['HTTPS'] !== 'off') {
                    $__proto = 'https';
                  }

                  $__proto = ($__proto === 'https') ? 'https' : 'http';
                  $__base = $__proto . '://' . $__host;
                }

                define('WP_HOME', $__base);
                define('WP_SITEURL', $__base);
                define('FORCE_SSL_ADMIN', true);

                define('MATOMO_API_URL', getenv('MATOMO_API_URL'));
                define('MATOMO_TOKEN',   getenv('MATOMO_TOKEN'));
                define('MATOMO_USER',    getenv('MATOMO_USER'));
                define('MATOMO_PASS',    getenv('MATOMO_PASS'));
                define('MATOMO_SITE_ID', getenv('MATOMO_SITE_ID'));
                define('API_URL',        getenv('API_URL'));

                define('WP_MEMORY_LIMIT', '512M');
                define('WP_MAX_MEMORY_LIMIT', '512M');
                @ini_set('upload_max_filesize', '64M');
                @ini_set('post_max_size', '64M');
                @ini_set('max_execution_time', '300');
                @ini_set('max_input_vars', '5000');
          resources:
            limits:
              cpu: 800m
              memory: 2048Mi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: wordpress-persistent-storage
              mountPath: /var/www/html
            - name: wordpress-persistent-storage
              mountPath: /var/lib/wp-bootstrap
              subPath: wp-bootstrap-state
            # FOR MySQL CA certificate
            - name: azure-mysql-ca-cert-blue
              readOnly: true
              mountPath: /etc/ssl/mysql/

      volumes:
        - name: wordpress-persistent-storage
          persistentVolumeClaim:
            claimName: wp-pv-claim
        # FOR MySQL CA certificate
        - name: azure-mysql-ca-cert-blue
          secret:
            secretName: azure-mysql-ca-cert-blue
            defaultMode: 420
            
